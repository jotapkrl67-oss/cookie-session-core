[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudflare-playwright-service"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "playwright==1.62.0",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/playwright_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
