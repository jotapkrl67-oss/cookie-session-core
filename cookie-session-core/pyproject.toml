[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cookie-session-core"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "cryptography>=44,<47",
  "curl_cffi>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx[http2]>=0.28,<1",
  "pydantic-settings>=2.6,<3",
  "pyjwt[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.32,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cookie_session_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"] # Embedded minified JavaScript/HTML is intentionally kept contiguous.
